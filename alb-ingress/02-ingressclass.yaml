## Cluster-scoped, applied once. Marked the cluster default so plain
## `kubernetes.io/ingress.class` omission still resolves to ALB — every
## Ingress below sets it explicitly anyway, belt and suspenders.
apiVersion: elbv2.k8s.aws/v1beta1
kind: IngressClassParams
metadata:
  name: alb-nutriai
spec:
  scheme: internet-facing
  ipAddressType: ipv4
  # Tags applied to the ALB itself — useful for cost allocation/reporting.
  tags:
    - key: project
      value: nutriai
    - key: managed-by
      value: aws-load-balancer-controller
---
apiVersion: networking.k8s.io/v1
kind: IngressClass
metadata:
  name: alb
  annotations:
    ingressclass.kubernetes.io/is-default-class: "true"
spec:
  controller: ingress.k8s.aws/alb
  parameters:
    apiGroup: elbv2.k8s.aws
    kind: IngressClassParams
    name: alb-nutriai
