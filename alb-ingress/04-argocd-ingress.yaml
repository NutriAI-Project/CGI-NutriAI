## Public entry point for the ArgoCD UI/API — browser access instead of the
## SSH-tunnel path in docs/09-argocd-gitops.md §2 (that path still works
## too; this is additive). Requires 04-argocd-server-insecure-patch.yaml
## applied first, or the ALB's plain-HTTP health checks against
## argocd-server will fail (it expects TLS on 8080 otherwise).
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: argocd-server
  namespace: argocd
  labels:
    app.kubernetes.io/part-of: nutriai-alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: nutriai-alb
    # LOWEST order number (= HIGHEST priority) of the two rules in this
    # group — must be evaluated BEFORE nutriai-gateway's host-agnostic
    # catch-all rule, or that rule swallows every request regardless of
    # Host header. See that file's comment for what happened when this
    # was backwards.
    alb.ingress.kubernetes.io/group.order: "10"
    # HTTP-only until a real ACM cert exists — see 03-nutriai-gateway-ingress.yaml's
    # comment for why the placeholder cert ARN breaks the listener outright.
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /healthz
    alb.ingress.kubernetes.io/healthcheck-port: "8080"
    alb.ingress.kubernetes.io/backend-protocol: HTTP
spec:
  ingressClassName: alb
  rules:
    - host: argocd.nutriai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: argocd-server
                port:
                  number: 80
