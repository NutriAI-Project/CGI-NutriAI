## Public entry point for the app. Targets kgateway's own Envoy proxy
## Service (still type: ClusterIP — unchanged from helm/nutriai/values.yaml)
## directly at pod IPs, so every existing HTTPRoute
## (/, /api, /auth-service, ... — see docs/06-gateway-routing.md) keeps
## working unmodified behind this ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutriai-gateway
  namespace: nutriai-prod
  labels:
    app.kubernetes.io/part-of: nutriai-alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Shared-ALB group — merges with the argocd Ingress into ONE ALB
    # instead of provisioning a second one. Rules are ordered by priority.
    alb.ingress.kubernetes.io/group.name: nutriai-alb
    # Deliberately the HIGHEST order number (= LOWEST priority, evaluated
    # LAST) of the two rules in this group. This rule has no `host:` so it
    # matches everything — if it were evaluated before argocd-server's
    # host-scoped rule, it would swallow every request including ones
    # meant for ArgoCD. Caught live: first apply served the NutriAI
    # frontend for both hostnames.
    alb.ingress.kubernetes.io/group.order: "20"
    # HTTP-only until a real ACM cert exists — the placeholder ARN below
    # is not valid and the controller rejects the listener outright if a
    # certificate-arn annotation is present but unparsable, rather than
    # silently skipping it. Add certificate-arn + change listen-ports back
    # to include HTTPS + ssl-redirect once you have a real cert (README §
    # "An ACM certificate for HTTPS").
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: "80"
spec:
  ingressClassName: alb
  rules:
    # No `host:` — matches any Host header, so the bare ALB DNS name works
    # directly for testing with no DNS/Route53 setup required.
    #
    # Every path below forwards to the SAME nutriai-gateway Service (kgateway's
    # Envoy proxy) — the actual per-microservice split happens one hop later,
    # inside the cluster, via the existing HTTPRoute objects
    # (helm/nutriai/templates/httproute.yaml, see docs/06-gateway-routing.md).
    # Listed explicitly here — one path per microservice — so the routing is
    # visible directly in the Ingress object, not just inferred from kgateway
    # config one layer down.
    - http:
        paths:
          - path: /admin-service
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /api
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /auth-service
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /diet-service
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /document-service
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /health-service
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /notification-service
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /profile-service
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
          - path: /
            pathType: Prefix
            backend: {service: {name: nutriai-gateway, port: {number: 80}}}
