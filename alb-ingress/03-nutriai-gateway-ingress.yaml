## Public entry point for the app. Targets kgateway's own Envoy proxy
## Service (still type: ClusterIP — unchanged from helm/nutriai/values.yaml)
## directly at pod IPs, so every existing HTTPRoute
## (/, /api, /auth-service, ... — see docs/06-gateway-routing.md) keeps
## working unmodified behind this ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutriai-gateway
  namespace: nutriai-prod
  labels:
    app.kubernetes.io/part-of: nutriai-alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Shared-ALB group — merges with the argocd Ingress into ONE ALB
    # instead of provisioning a second one. Rules are ordered by priority.
    alb.ingress.kubernetes.io/group.name: nutriai-alb
    alb.ingress.kubernetes.io/group.order: "10"
    # HTTP-only until a real ACM cert exists — the placeholder ARN below
    # is not valid and the controller rejects the listener outright if a
    # certificate-arn annotation is present but unparsable, rather than
    # silently skipping it. Add certificate-arn + change listen-ports back
    # to include HTTPS + ssl-redirect once you have a real cert (README §
    # "An ACM certificate for HTTPS").
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}]'
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: "80"
spec:
  ingressClassName: alb
  rules:
    # No `host:` — matches any Host header, so the bare ALB DNS name works
    # directly for testing with no DNS/Route53 setup required. Add a host
    # rule back (see README §6) once you point a real domain at the ALB —
    # group.order 10 still lets it coexist with argocd-server's host-scoped
    # rule below.
    - http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nutriai-gateway
                port:
                  number: 80
