## Public entry point for the app. Targets kgateway's own Envoy proxy
## Service (still type: ClusterIP — unchanged from helm/nutriai/values.yaml)
## directly at pod IPs, so every existing HTTPRoute
## (/, /api, /auth-service, ... — see docs/06-gateway-routing.md) keeps
## working unmodified behind this ALB.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutriai-gateway
  namespace: nutriai-prod
  labels:
    app.kubernetes.io/part-of: nutriai-alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    # Shared-ALB group — merges with the argocd Ingress into ONE ALB
    # instead of provisioning a second one. Rules are ordered by priority.
    alb.ingress.kubernetes.io/group.name: nutriai-alb
    alb.ingress.kubernetes.io/group.order: "10"
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    # Replace with a real ACM cert ARN to serve HTTPS; safe to leave unset
    # to prove HTTP connectivity first (the controller then just skips the
    # 443 listener for this rule).
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERTIFICATE_ARN>"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /
    alb.ingress.kubernetes.io/healthcheck-port: "80"
spec:
  ingressClassName: alb
  rules:
    - host: app.nutriai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: nutriai-gateway
                port:
                  number: 80
