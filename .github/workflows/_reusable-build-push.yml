name: Reusable - Build & Push to ECR

## Called by each service's ci-<service>.yml. Stages: clone (checkout) ->
## build docker image -> push to ECR -> bump the Helm values file (GitOps
## commit) so ArgoCD picks up the new tag. See docs/08-cicd-github-actions.md.

on:
  workflow_call:
    inputs:
      service-name:
        description: "Folder under services/ and Helm values key, e.g. auth-service"
        required: true
        type: string
      image-tag:
        description: "Tag to build and push, e.g. v1.2.3 or dev-<sha>"
        required: true
        type: string
      environment:
        description: "dev or prod — selects values-<env>.yaml"
        required: false
        type: string
        default: prod
      aws-region:
        required: false
        type: string
        default: us-east-1
      update-gitops-tag:
        description: "Commit the new image tag into helm/nutriai/values-<env>.yaml"
        required: false
        type: boolean
        default: true

permissions:
  id-token: write   # required for OIDC -> AssumeRoleWithWebIdentity
  contents: write    # required to commit the GitOps tag bump back to this repo

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    environment: ${{ inputs.environment }}
    steps:
      - name: Clone
        uses: actions/checkout@v4

      - name: Configure AWS credentials (OIDC — no long-lived keys)
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_GITHUB_ACTIONS_ROLE_ARN }}
          aws-region: ${{ inputs.aws-region }}

      - name: Login to Amazon ECR
        id: ecr-login
        uses: aws-actions/amazon-ecr-login@v2

      - name: Ensure ECR repository exists
        run: |
          aws ecr describe-repositories --repository-names "nutriai/${{ inputs.service-name }}" >/dev/null 2>&1 || \
          aws ecr create-repository \
            --repository-name "nutriai/${{ inputs.service-name }}" \
            --image-scanning-configuration scanOnPush=true \
            --image-tag-mutability IMMUTABLE

      - name: Build image
        working-directory: services/${{ inputs.service-name }}
        run: |
          docker build \
            -t "${{ steps.ecr-login.outputs.registry }}/nutriai/${{ inputs.service-name }}:${{ inputs.image-tag }}" \
            -t "${{ steps.ecr-login.outputs.registry }}/nutriai/${{ inputs.service-name }}:latest" \
            .

      - name: Push image
        run: |
          docker push "${{ steps.ecr-login.outputs.registry }}/nutriai/${{ inputs.service-name }}:${{ inputs.image-tag }}"
          docker push "${{ steps.ecr-login.outputs.registry }}/nutriai/${{ inputs.service-name }}:latest"

      - name: Bump Helm values (GitOps tag update)
        if: ${{ inputs.update-gitops-tag }}
        run: |
          VALUES_FILE="helm/nutriai/values-${{ inputs.environment }}.yaml"
          sudo snap install yq 2>/dev/null || (sudo apt-get update -y && sudo apt-get install -y yq) || true
          command -v yq >/dev/null || (curl -sL https://github.com/mikefarah/yq/releases/latest/download/yq_linux_amd64 -o /usr/local/bin/yq && sudo chmod +x /usr/local/bin/yq)
          yq -i ".services.\"${{ inputs.service-name }}\".image.tag = \"${{ inputs.image-tag }}\"" "$VALUES_FILE"

      - name: Commit & push tag bump
        if: ${{ inputs.update-gitops-tag }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "helm/nutriai/values-${{ inputs.environment }}.yaml"
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            for i in 1 2 3 4 5; do
              git commit -m "ci: bump ${{ inputs.service-name }} image tag to ${{ inputs.image-tag }} [skip ci]" && \
              git pull --rebase origin "${GITHUB_REF_NAME}" && \
              git push origin HEAD:"${GITHUB_REF_NAME}" && break
              echo "Retrying push ($i/5)..."; sleep $((RANDOM % 5 + 1))
            done
          fi

      - name: Summary
        run: |
          echo "### Image pushed :rocket:" >> "$GITHUB_STEP_SUMMARY"
          echo "\`${{ steps.ecr-login.outputs.registry }}/nutriai/${{ inputs.service-name }}:${{ inputs.image-tag }}\`" >> "$GITHUB_STEP_SUMMARY"
