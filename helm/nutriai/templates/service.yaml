{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Service
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "0"
  labels:
    {{- include "nutriai.svcLabels" (list $ $name $svc) | nindent 4 }}
spec:
  type: ClusterIP
  selector:
    {{- include "nutriai.svcSelectorLabels" (list $ $name) | nindent 4 }}
  ports:
    - name: http
      port: {{ $svc.servicePort }}
      targetPort: {{ $svc.containerPort }}
---
{{- end }}
{{- end }}
