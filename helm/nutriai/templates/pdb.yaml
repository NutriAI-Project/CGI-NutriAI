{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (gt (int $svc.hpa.maxReplicas) 1) }}
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "nutriai.svcLabels" (list $ $name $svc) | nindent 4 }}
spec:
  minAvailable: 1
  selector:
    matchLabels:
      {{- include "nutriai.svcSelectorLabels" (list $ $name) | nindent 6 }}
---
{{- end }}
{{- end }}
