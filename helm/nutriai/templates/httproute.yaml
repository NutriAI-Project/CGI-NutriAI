{{- if .Values.gateway.create }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "2"
  labels:
    {{- include "nutriai.svcLabels" (list $ $name $svc) | nindent 4 }}
spec:
  parentRefs:
    - name: {{ $.Values.gateway.name }}
  rules:
    - matches:
        - path:
            type: {{ $svc.pathType }}
            value: {{ $svc.path }}
      {{- if $svc.stripPrefix }}
      filters:
        - type: URLRewrite
          urlRewrite:
            path:
              type: ReplacePrefixMatch
              replacePrefixMatch: /
      {{- end }}
      backendRefs:
        - name: {{ $name }}
          port: {{ $svc.servicePort }}
---
{{- end }}
{{- end }}
{{- end }}
