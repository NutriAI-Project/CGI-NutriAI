{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ $name }}
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  labels:
    {{- include "nutriai.svcLabels" (list $ $name $svc) | nindent 4 }}
spec:
  replicas: {{ $svc.replicas }}
  revisionHistoryLimit: 3
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  selector:
    matchLabels:
      {{- include "nutriai.svcSelectorLabels" (list $ $name) | nindent 6 }}
  template:
    metadata:
      labels:
        {{- include "nutriai.svcLabels" (list $ $name $svc) | nindent 8 }}
      annotations:
        checksum/config: {{ include (print $.Template.BasePath "/configmap.yaml") $ | sha256sum }}
    spec:
      serviceAccountName: {{ include "nutriai.serviceAccountName" $ }}
      securityContext:
        runAsNonRoot: true
        {{- if eq $svc.tier "frontend" }}
        runAsUser: 101
        {{- else }}
        runAsUser: 1000
        {{- end }}
      containers:
        - name: {{ $name }}
          image: {{ include "nutriai.image" (list $ $svc) }}
          imagePullPolicy: {{ $.Values.global.imagePullPolicy }}
          ports:
            - containerPort: {{ $svc.containerPort }}
              name: http
          envFrom:
            - configMapRef:
                name: {{ $name }}-config
            - secretRef:
                name: {{ $name }}-secret
                # A service with no usesDb and no secretEnv keys (e.g.
                # frontend-service) has no *-secret object under the
                # ExternalSecrets path — don't block pod startup on it.
                optional: true
          {{- if $svc.pvc.enabled }}
          volumeMounts:
            - name: {{ $svc.pvc.name }}
              mountPath: {{ $svc.pvc.mountPath }}
          {{- end }}
          resources:
            {{- toYaml $svc.resources | nindent 12 }}
          readinessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: {{ $svc.healthPath }}
              port: http
            initialDelaySeconds: 20
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 3
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop: ["ALL"]
              {{- if eq $svc.tier "frontend" }}
              # frontend-service's image sets cap_net_bind_service via `setcap`
              # on the nginx binary so it can bind port 80 as non-root (uid 101)
              # — dropping ALL capabilities strips that back off and nginx
              # fails with "Operation not permitted". Caught live on the real
              # cluster (backend services don't bind privileged ports, so they
              # don't need this).
              add: ["NET_BIND_SERVICE"]
              {{- end }}
      {{- if $svc.pvc.enabled }}
      volumes:
        - name: {{ $svc.pvc.name }}
          persistentVolumeClaim:
            claimName: {{ $svc.pvc.name }}
      {{- end }}
---
{{- end }}
{{- end }}
