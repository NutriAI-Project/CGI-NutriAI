{{- if not .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if $svc.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ $name }}-secret
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "nutriai.svcLabels" (list $ $name $svc) | nindent 4 }}
type: Opaque
stringData:
  {{- if $svc.usesDb }}
  DATABASE_URL: {{ include "nutriai.databaseUrl" $ | quote }}
  {{- end }}
  {{- range $key, $val := $svc.secretEnv }}
  {{ $key }}: {{ $val | quote }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
