{{/*
Requires the Gateway API CRDs + the kgateway controller already installed on
the cluster (cluster-scoped, installed once — docs/06-gateway-routing.md).
This Gateway itself defaults to ClusterIP (no cloud LoadBalancer is created).
Reach it via `kubectl port-forward` through the bastion tunnel, or switch
gateway.serviceType to NodePort — see docs/06-gateway-routing.md.
*/}}
{{- if .Values.gateway.create }}
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ .Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    {{- if eq .Values.gateway.serviceType "ClusterIP" }}
    networking.kgateway.dev/service-type: ClusterIP
    {{- end }}
  labels:
    {{- include "nutriai.commonLabels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  listeners:
    - name: http
      protocol: HTTP
      port: {{ .Values.gateway.listenerPort }}
      allowedRoutes:
        namespaces:
          from: Same
{{- end }}
