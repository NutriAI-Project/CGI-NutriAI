{{/*
Prod-grade alternative to templates/secret.yaml: pulls real secret values from
AWS Secrets Manager via the External Secrets Operator instead of storing them
(even as a git-ignored overlay) on any machine. Enable with
externalSecrets.enabled=true in values-prod.yaml. Requires:
  1. External Secrets Operator installed on the cluster (docs/09-argocd-gitops.md)
  2. A SecretStore named `.Values.externalSecrets.secretStoreRefName` pointing
     at AWS Secrets Manager, authenticated via IRSA
  3. One secret per service in AWS Secrets Manager named
     `nutriai/<environment>/<service-name>` containing the same keys used in
     values-secrets.example.yaml, plus `nutriai/<environment>/postgres`
     (key "password") for the shared DB credential used to build DATABASE_URL
*/}}
{{- if .Values.externalSecrets.enabled }}
{{- range $name, $svc := .Values.services }}
{{- if and $svc.enabled (or $svc.usesDb (gt (len $svc.secretEnv) 0)) }}
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $name }}-secret
  namespace: {{ $.Values.global.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
  labels:
    {{- include "nutriai.svcLabels" (list $ $name $svc) | nindent 4 }}
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    name: {{ $.Values.externalSecrets.secretStoreRefName }}
    kind: ClusterSecretStore
  target:
    name: {{ $name }}-secret
    creationPolicy: Owner
    {{- if $svc.usesDb }}
    template:
      # Default mergePolicy is "Replace" — the templated DATABASE_URL was
      # silently REPLACING the entire secret body instead of adding to it,
      # dropping every key pulled in via dataFrom.extract below (JWT_SECRET_KEY
      # included). Caught live: auth-service and api-gateway-service both had
      # a real, matching JWT_SECRET_KEY in Secrets Manager, but neither pod
      # ever saw it — every login token failed validation at /auth/me.
      mergePolicy: Merge
      data:
        DATABASE_URL: "{{ printf "postgresql://%s:{{ .pgPassword }}@postgres.%s.svc.cluster.local:5432/%s" $.Values.postgres.credentials.username $.Values.global.namespace $.Values.postgres.credentials.database }}"
    {{- end }}
  {{- if $svc.usesDb }}
  data:
    - secretKey: pgPassword
      remoteRef:
        key: nutriai/{{ $.Values.global.environment }}/postgres
        property: password
  {{- end }}
  {{- /* Only fetch nutriai/<env>/<service> when there's actually something
        to fetch — a service with no secretEnv keys (e.g. frontend-service)
        has nothing in Secrets Manager and dataFrom.extract would fail the
        whole sync waiting on a secret that was never meant to exist.
        Caught live on the real cluster. */}}
  {{- if gt (len $svc.secretEnv) 0 }}
  dataFrom:
    - extract:
        key: nutriai/{{ $.Values.global.environment }}/{{ $name }}
  {{- end }}
---
{{- end }}
{{- end }}
{{- end }}
