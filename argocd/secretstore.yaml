## ClusterSecretStore for External Secrets Operator, backed by AWS Secrets
## Manager via IRSA (no static AWS keys on the cluster). Apply this manually
## once, BEFORE the first nutriai-prod sync (it is not part of the nutriai
## Helm chart itself since it's cluster infra, not application config).
## See docs/09-argocd-gitops.md §3.
##
##   kubectl apply -f argocd/secretstore.yaml
##
## Prerequisite: an IAM role with an IRSA trust policy for the
## external-secrets ServiceAccount, with a policy allowing
## secretsmanager:GetSecretValue on arn:aws:secretsmanager:*:*:secret:nutriai/*
apiVersion: external-secrets.io/v1
kind: ClusterSecretStore
metadata:
  name: nutriai-secretstore
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: external-secrets
            namespace: external-secrets
