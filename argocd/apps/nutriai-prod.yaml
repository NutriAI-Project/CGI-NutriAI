## Child Application — production. Auto-sync + self-heal + prune enabled
## per explicit request — a git push to main now rolls out automatically,
## no manual `argocd app sync` step needed. (Previously manual-only, matching
## the "review every prod change" convention this was ported from — flip
## the `automated:` block back off if you want that safety net again.)
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: nutriai-prod
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: nutriai
  source:
    repoURL: "https://github.com/NutriAI-Project/CGI-NutriAI.git"
    targetRevision: main
    path: helm/nutriai
    helm:
      valueFiles:
        - values.yaml
        - values-prod.yaml
  destination:
    server: "https://kubernetes.default.svc"
    namespace: nutriai-prod
  syncPolicy:
    automated:
      selfHeal: true
      prune: true
    syncOptions:
      - CreateNamespace=true
      - ServerSideApply=true
      - RespectIgnoreDifferences=true
    retry:
      limit: 3
      backoff:
        duration: 10s
        factor: 2
        maxDuration: 2m
  ignoreDifferences:
    - group: apps
      kind: Deployment
      jsonPointers:
        - /spec/replicas   # let the HPA own replica count without ArgoCD fighting it
