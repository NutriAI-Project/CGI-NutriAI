## Independent ALB from ../alb-ingress/ (own group.name → its own ALB,
## billed separately) — this fronts the mesh demo only. Targets
## istio-ingressgateway's Service (still ClusterIP per
## 01-istio-operator.yaml) directly at pod IPs.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: nutriai-mesh-ingress
  namespace: istio-system
  labels:
    app.kubernetes.io/part-of: nutriai-mesh-alb
  annotations:
    kubernetes.io/ingress.class: alb
    alb.ingress.kubernetes.io/scheme: internet-facing
    alb.ingress.kubernetes.io/target-type: ip
    alb.ingress.kubernetes.io/group.name: nutriai-mesh-alb
    alb.ingress.kubernetes.io/listen-ports: '[{"HTTP": 80}, {"HTTPS": 443}]'
    alb.ingress.kubernetes.io/certificate-arn: "<ACM_CERTIFICATE_ARN>"
    alb.ingress.kubernetes.io/ssl-redirect: "443"
    alb.ingress.kubernetes.io/healthcheck-path: /healthz/ready
    alb.ingress.kubernetes.io/healthcheck-port: "15021"
spec:
  ingressClassName: alb
  rules:
    - host: mesh.nutriai.example.com
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: istio-ingressgateway
                port:
                  number: 80
