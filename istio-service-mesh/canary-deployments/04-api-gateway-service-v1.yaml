## Trimmed for the mesh demo: this namespace only runs frontend-service +
## api-gateway-service, so most of the "real" api-gateway-service's
## downstream env vars (auth/document/diet/... service URLs) are omitted —
## it will start but its calls to other NutriAI backends will fail until
## you either point those URLs at ../helm's nutriai-prod Services or add
## v1/v2 pairs here for the services you need. Good enough to exercise
## the routing/mTLS/canary wiring in isolation.
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api-gateway-service-v1
  namespace: nutriai-mesh
  labels:
    app: api-gateway-service
    version: v1
spec:
  replicas: 1
  selector:
    matchLabels:
      app: api-gateway-service
      version: v1
  template:
    metadata:
      labels:
        app: api-gateway-service
        version: v1
    spec:
      containers:
        - name: api-gateway-service
          image: "733236986490.dkr.ecr.us-east-1.amazonaws.com/nutriai/api-gateway-service:v0.1.0"
          ports:
            - containerPort: 8000
          env:
            - name: APP_NAME
              value: "NutriAI API Gateway (mesh demo)"
            - name: ALGORITHM
              value: "HS256"
          resources:
            requests: { cpu: 75m, memory: 128Mi }
            limits: { cpu: 250m, memory: 256Mi }
          readinessProbe:
            httpGet: { path: /health, port: 8000 }
            initialDelaySeconds: 5
